<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Savings Calculator</title>
<style>
body{font-family:Arial;background:#f0fdf4;padding:25px}
main{max-width:500px;margin:auto;background:white;padding:25px;border-radius:15px}
input{width:100%;padding:12px;margin:10px 0;box-sizing:border-box}
button{padding:12px 18px;background:#15803d;color:white;border:0;border-radius:7px;cursor:pointer}
#result{padding:18px;background:#dcfce7;margin-top:15px;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>Savings Calculator</h1>
<input id="initial" type="number" min="0" placeholder="Initial savings">
<input id="monthly" type="number" min="0" placeholder="Monthly deposit">
<input id="rate" type="number" min="0" max="100" step="any" placeholder="Annual interest rate (%)">
<input id="years" type="number" min="1" max="100" placeholder="Years">
<button onclick="calculate()">Calculate Savings</button>
<div id="result">Your projection will appear here.</div>
</main>
<script>
function calculate(){
 const initial=Number(document.getElementById("initial").value);
 const monthly=Number(document.getElementById("monthly").value);
 const rate=Number(document.getElementById("rate").value);
 const years=Number(document.getElementById("years").value);
 const out=document.getElementById("result");
 if(initial<0||monthly<0||rate<0||rate>100||years<=0||
 !document.getElementById("years").value){
  out.textContent="Enter valid savings information.";
  return;
 }
 const months=years*12;
 const r=rate/1200;
 let balance=initial;
 for(let i=0;i<months;i++){
  balance=balance*(1+r)+monthly;
 }
 const invested=initial+monthly*months;
 out.textContent=`Estimated balance: ${balance.toFixed(2)} | Total deposits: ${invested.toFixed(2)} | Estimated interest: ${(balance-invested).toFixed(2)}`;
}
</script>
</body>
</html>
